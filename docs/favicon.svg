<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 
    Theme: Flatly (Bootswatch)
    Concept: Abstract neural node forming a cat/coffee shape.
    Very clean, highly recognizable at small sizes.
  -->
  <rect width="512" height="512" rx="100" fill="#ffffff" />
  
  <g transform="translate(0, 30)">
    <!-- Hexagon Base (Mug/Node) -->
    <polygon points="256,380 136,310 136,170 256,240 376,170 376,310" fill="#2c3e50" />
    
    <!-- Top edge of the Mug -->
    <polygon points="256,100 136,170 256,240 376,170" fill="#18bc9c" opacity="0.8" />
    
    <!-- Cat Ears branching off the hexagon -->
    <polygon points="136,170 106,60 196,135" fill="#2c3e50" />
    <polygon points="376,170 406,60 316,135" fill="#2c3e50" />

    <!-- Neural Connection Lines (Inside the mug) -->
    <line x1="256" y1="240" x2="256" y2="380" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="136" y1="310" x2="256" y2="240" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="376" y1="310" x2="256" y2="240" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    
    <!-- Nodes -->
    <circle cx="256" cy="240" r="16" fill="#18bc9c" />
    <circle cx="256" cy="380" r="12" fill="#18bc9c" />
    <circle cx="136" cy="310" r="12" fill="#18bc9c" />
    <circle cx="376" cy="310" r="12" fill="#18bc9c" />
  </g>
</svg>