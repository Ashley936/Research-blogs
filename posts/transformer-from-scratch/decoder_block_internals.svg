<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">One DecoderBlock: masked self-attention over the decoder's own tokens, then cross-attention where queries come from the decoder and keys and values come from the encoder output, then a feed-forward block, each wrapped in a residual connection, repeated six times with a final layer norm.</desc>
